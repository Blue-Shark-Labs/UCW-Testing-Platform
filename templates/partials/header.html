<div class="w-full h-full bg-white border-b-2 border-app-divider flex items-center justify-between px-12 py-2">
    <div class="flex items-center justify-center gap-3">
        <img
            class="h-10 w-10 object-contain rounded-md"
            src="{{ url_for('static', filename='branding/blue_shark_labs_logo_vector_graphic.svg') }}"
            alt="Blue Shark Labs logo"
        >
        <div class="flex flex-col items-start justify-start">
            <h4 class="text-text-primary text-lg font-extrabold leading-none">Blue Shark</h4>
            <h4 class="text-sm font-semibold text-app-primary uppercase">Labs</h4>
        </div>
    </div>
    <div class="flex flex-col items-center justify-center">
        <h4 class="text-xs font-semibold text-app-primary uppercase leading-none">Blue Shark - {% block page_section %}Administration{% endblock %}</h4>
        <h4 class="text-text-primary text-lg font-extrabold">{% block page_title %}Administration Panel{% endblock %}</h4>
    </div>
    {% block header_page_specific_content %}
    {% endblock %}
    <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 border border-app-divider rounded-full px-3 py-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16835D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shield"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <h4 class="text-slate-500 text-xs font-semibold">Administrator</h4>
        </div>
        <div class="flex items-center justify-center bg-app-primary/20 rounded-full h-8 w-8">
            <h4 class="text-app-primary text-sm font-extrabold">MJ</h4>
        </div>
    </div>
</div>

<div class="app-page-header">
    <div class="app-header-brand">
        <img
            class="h-10 w-10 object-contain rounded-md"
            src="{{ url_for('static', filename='branding/blue_shark_labs_logo_vector_graphic.svg') }}"
            alt="Blue Shark Labs logo"
        >
        <div class="flex flex-col items-start justify-start">
            <p class="text-text-primary text-lg font-extrabold leading-none">Blue Shark</p>
            <p class="text-sm font-semibold text-app-primary uppercase">Labs</p>
        </div>
    </div>
    <div class="app-header-context">
        <p class="mb-1 text-xs font-semibold uppercase text-app-primary">Blue Shark - {{ page_section }}</p>
        <p class="text-center text-lg font-extrabold text-text-primary">{{ page_title }}</p>
    </div>
    <div class="app-header-controls">
        {{ header_page_specific_content | safe }}
        <div class="flex items-center gap-2 rounded-full border border-app-divider px-3 py-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16835D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-shield" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <p class="text-xs font-semibold text-slate-700">{{ (user_role or "student") | capitalize }}</p>
        </div>
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-app-primary/20" aria-hidden="true">
            <span class="text-sm font-extrabold text-blue-800">{{ profile_initials }}</span>
        </div>
    </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In — Reinforcement Testing Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-app-background text-slate-900 font-roboto">
    <div class="flex min-h-screen flex-col items-center justify-center px-4 py-8">
        <div class="w-full max-w-sm rounded-lg border border-app-divider bg-white p-8 shadow-sm">
            <div class="mb-6 flex flex-col items-center gap-2">
                <img
                    class="h-12 w-12 object-contain rounded-md"
                    src="{{ url_for('static', filename='branding/blue_shark_labs_logo_vector_graphic.svg') }}"
                    alt="Blue Shark Labs logo"
                >
                <h1 class="text-text-primary text-lg font-extrabold">Log In</h1>
            </div>

            {% if error %}
            <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
            {% endif %}
            {% if warning %}
            <p class="mb-4 rounded-md bg-amber-50 px-3 py-2 text-sm text-amber-800">{{ warning }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('login_route') }}" class="flex flex-col gap-4">
                <div class="flex flex-col gap-1">
                    <label for="email" class="text-xs font-semibold uppercase text-slate-500">Username</label>
                    <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus class="rounded-md border border-app-divider px-3 py-2 text-sm">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="password" class="text-xs font-semibold uppercase text-slate-500">Password</label>
                    <input type="password" id="password" name="password" required class="rounded-md border border-app-divider px-3 py-2 text-sm">
                </div>
                <button type="submit" class="mt-2 rounded-full bg-app-primary px-4 py-2 text-sm font-semibold text-white">Log In</button>
            </form>

            <p class="mt-4 text-center text-sm text-slate-500">Don't have an account? <a href="/register" class="font-medium text-app-primary no-underline">Sign Up</a></p>
        </div>
    </div>
</body>
</html>

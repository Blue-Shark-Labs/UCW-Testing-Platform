<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reinforcement Testing Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-slate-100 text-slate-900 font-sans">
    <div class="flex min-h-screen flex-col">
        {% include './partials/navbar.html' %}

        <div class="mx-auto w-full max-w-4xl flex-1 px-4 py-8">
            <h1 class="mb-2 text-2xl font-semibold">{{ content.product_name }}</h1>
            <p class="text-slate-500">{{ content.product_description }}</p>

            <div class="mt-8">
                <h2 class="mb-2 text-lg font-semibold">Contact us</h2>
                <p>{{ content.contact_email }}</p>
                <p>{{ content.contact_phone }}</p>
                <p>{{ content.contact_address }}</p>
            </div>
        </div>

        {% include './partials/footer.html' %}
    </div>
</body>
</html>
